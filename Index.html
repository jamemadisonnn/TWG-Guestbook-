c/button>\u003c/div>\u003c/form>`,true);}\nfunction csvSafe(s){const x=String(s??'');return '\"'+(/^[\\s]*[=+@\\-]/.test(x)?\"'\":'')+x.replace(/\"/g,'\"\"')+'\"';}\nfunction dbDownload(name,lines){const blob=new Blob(['\\uFEFF'+lines.map(row=>row.map(csvSafe).join(',')).join('\\r\\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}\nfunction dbExport(){dbDownload('GuestGraph_Customers_'+today()+'.csv',[['Name','Number','Email','Gender','Age','Last Purchase','Customer Since','Marketing Consent'],...dbRowsFiltered().map(c=>[c.name,c.phone,c.email,c.gender,c.age??'',c.lastPurchase,c.since,c.consent])]);notify('Customer CSV exported.','success');}\nfunction dbTemplate(){dbDownload('GuestGraph_CSV_Template.csv',[['Name','Number','Email','Gender','Age','Last Purchase','Customer Since','Marketing Consent'],['Alex Tan','0123456789','alex@example.com','Unspecified','','','2026-11-21','no']]);notify('Template downloaded.','success');}\nfunction csvParse(text){const records=[],rows=[],max=20000;let row=[],val='',quoted=false;for(let i=0;i\u003ctext.length;i++){const c=text[i];if(c==='\"'){if(quoted&&text[i+1]==='\"'){val+='\"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(val);val='';}else if((c==='\\r'||c==='\\n')&&!quoted){if(c==='\\r'&&text[i+1]==='\\n')i++;row.push(val);if(row.some(x=>x.trim()))rows.push(row);row=[];val='';if(rows.length>max+1)throw Error('Import a maximum of 20,000 CSV records at once.');}else val+=c;}if(quoted)throw Error('CSV contains an unclosed quote.');row.push(val);if(row.some(x=>x.trim()))rows.push(row);if(rows.length\u003c2)throw Error('CSV must include headers and at least one guest.');const heads=rows.shift().map(x=>x.toLowerCase().replace(/[^a-z]/g,''));const col=names=>heads.findIndex(h=>names.includes(h));const ix={name:col(['name','fullname','customername','guestname']),phone:col(['number','phone' const target=state.campaignAnalytics.campaign;return state.claims.filter(c=>target==='all'||c.campaignId===target);}\nfunction campaignMetrics(){const a=state.campaignAnalytics,filtered=campaignScopedClaims(),issued=filtered.filter(c=>eventDay(c.createdAt)>=a.from&&eventDay(c.createdAt)\u003c=a.to),redeemed=issued.filter(c=>c.status==='redeemed');return {active:state.campaigns.filter(c=>active(c)&&(a.campaign==='all'||a.campaign===c.id)).length,issued:issued.length,redeemed:redeemed.length,rate:issued.length?100*redeemed.length/issued.length:0};}\nfunction campaignSeries(){const a=state.campaignAnalytics,dates=campaignDates(),lookup=new Map(dates.map((d,i)=>[d.key,i])),data=dates.map(d=>({...d,issued:0,redeemed:0}));for(const c of campaignScopedClaims()){const cr=lookup.get(eventDay(c.createdAt));if(cr!==undefined)data[cr].issued++;if(c.status==='redeemed'){const re=lookup.get(eventDay(c.redeemedAt));if(re!==undefined)data[re].redeemed++;}}\n const preview=a.preview===null?state.claims.length===0:a.preview;\n if(preview){let j=0;for(const d of data){const dayNo=d.date.getDay(),weekend=dayNo===0||dayNo===6?9:0,wave=Math.abs(Math.sin((j+5)*.68)*8+Math.cos(j*.19)*4),modifier=a.campaign==='all'?1:0.54;d.issued=Math.max(1,Math.round((8+wave+weekend+Math.sin(j*.27)*3)*modifier));d.redeemed=Math.min(d.issued,Math.round(d.issued*(.55+.12*Math.sin(j*.35))));j++;}}\n return {data,preview};}\nfunction campaignFilterSelect(){const a=state.campaignAnalytics;return `\u003cselect class=\"analytics-select\" id=\"campaign-chart-filter\" aria-label=\"Campaign to analyze\">\u003coption value=\"all\">All campaigns\u003c/option>${state.campaigns.map(c=>`\u003coption value=\"${esc(c.id)}\" ${a.campaign===c.id?'selected':''}>${esc(c.title)}\u003c/option>`).join('')}\u003c/select>`;}\nfunction campaignPerformanceChart(series){const a=state.campaignAnalytics,data=series.data,W=820,H=244,L=40,R=18,T=19,B=33,plotW=W-L-R,plotH=H-T-B,max=Math.max(4,...data.map(d=>Math.max(d.issued,d.redeemed))),top=Math.ceil(max/4)*4,px=i=>L+(data.length===1?0:i/(data.length-1)*plotW),py=v=>T+plotH-v/top*plotH;\n const path=key=>data.map((d,i)=>(i?'L':'M')+px(i).toFixed(2)+' '+py(d[key]).toFixed(2)).join(' ');\n const area=key=>`M${px(0)} ${T+plotH} ${path(key).replace(/^M/,'L')} L${px(data.length-1)} ${T+plotH}Z`;\n const grid=Array.from({length:5},(_,i)=>{const y=T+i*plotH/4,lab=Math.round(top*(1-i/4));return `\u003cline x1=\"${L}\" y1=\"${y}\" x2=\"${W-R}\" y2=\"${y}\" stroke=\"#2a2a2d\" stroke-width=\"1\"/>\u003ctext x=\"${L-10}\" y=\"${y+4}\" text-anchor=\"end\" font-size=\"10\" fill=\"#7d7d82\">${lab}\u003c/text>`;}).join('');\n const labelIndices=[0,Math.round((data.length-1)*.25),Math.round((data.length-1)*.5),Math.round((data.length-1)*.75),data.length-1];const labels=[...new Set(labelIndices)].map(i=>`\u003ctext x=\"${px(i)}\" y=\"${H-7}\" text-anchor=\"middle\" font-size=\"10\" fill=\"#909094\">${data[i].date.toLocaleDateString('en-MY',{day:'numeric',month:'short'})}\u003c/text>`).join('');\n const showIssued=a.metric==='claims'||a.metric==='compare',showRedeemed=a.metric==='redemptions'||a.metric==='compare';return `\u003cdiv class=\"analytics-plot\" id=\"campaign-plot\">\u003csvg id=\"campaign-plot-svg\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"Campaign claim and redemption trends from ${a.from} to ${a.to}\">${grid}\u003cdefs>\u003clinearGradient id=\"campaign-area\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#dadadd\" stop-opacity=\".13\"/>\u003cstop offset=\"1\" stop-color=\"#dadadd\" stop-opacity=\"0\"/>\u003c/linearGradient>\u003c/defs>${showRedeemed?`\u003cpath d=\"${area('redeemed')}\" fill=\"url(#campaign-area)\"/>`:''}${showIssued?`\u003cpath d=\"${path('issued')}\" fill=\"none\" stroke=\"${a.metric==='compare'?'#7d7d85':'#f7f7f8'}\" stroke-width=\"${a.metric==='compare'?2:2.6}\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`:''}${showRede mpty('search','No matching campaigns','Try clearing your search or status filter.')}\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`;}\nfunction campaignToolbar(){const a=state.campaignAnalytics;return `\u003cdiv class=\"directory-head\">\u003cdiv class=\"campaign-search\">${ico('search',16)}\u003cinput id=\"campaign-search\" aria-label=\"Search campaigns\" placeholder=\"Search campaigns...\" value=\"${esc(a.search)}\" autocomplete=\"off\" spellcheck=\"false\"/>\u003cspan class=\"campaign-search-shortcut\" aria-hidden=\"true\">\u2318 K\u003c/span>\u003c/div>\u003cdiv class=\"campaign-toolbar-actions\">\u003cdiv class=\"campaign-toolbar-anchor\">\u003cbutton class=\"campaign-tool-btn campaign-more-btn\" type=\"button\" aria-label=\"More campaign actions\" title=\"More actions\" aria-expanded=\"${a.menuOpen}\" data-act=\"campaign-more\">\u2022\u2022\u2022\u003c/button>${a.menuOpen?`\u003cdiv class=\"campaign-popover campaign-more-popover\">\u003cbutton type=\"button\" data-act=\"export-campaigns\">${ico('download',14)} Export campaigns CSV\u003c/button>\u003cbutton type=\"button\" data-act=\"reset-campaign-filters\">${ico('close',14)} Clear filters\u003c/button>\u003c/div>`:''}\u003c/div>\u003cdiv class=\"campaign-toolbar-anchor\">\u003cbutton class=\"campaign-tool-btn ${a.status!=='all'?'has-filter':''}\" type=\"button\" aria-expanded=\"${a.filterOpen}\" data-act=\"campaign-filter-toggle\">${ico('filter',14)} \u003cspan>Filter\u003c/span>${a.status!=='all'?'\u003ci class=\"filter-active-dot\">\u003c/i>':''}\u003c/button>${a.filterOpen?`\u003cdiv class=\"campaign-popover campaign-filter-popover\">\u003cdiv class=\"campaign-popover-title\">Campaign status\u003c/div>${[['all','All'],['active','Active'],['paused','Paused'],['expired','Expired']].map(([v,t])=>`\u003cbutton type=\"button\" data-act=\"campaign-status\" data-id=\"${v}\" class=\"${a.status===v?'selected':''}\">${t}${a.status===v?ico('check',14):''}\u003c/button>`).join('')}\u003c/div>`:''}\u003c/div>${button(ico('plus')+' Create campaign','new-campaign',true,'btn-sm')}\u003c/div>\u003c/div>`;}\nfunction staffCampaigns(){\n const a=state.campaignAnalytics,m=campaignMetrics(),cards=[['Active campaigns',m.active,'Live right now'],['QR claims',m.issued,'Issued in selected period'],['Redeemed',m.redeemed,'Of claims issued in period'],['Redemption rate',m.rate.toFixed(1)+'%','Of claims issued in period']];\n const chart=a.expanded?(()=>{const series=campaignSeries();return `\u003cdiv class=\"performance-body\" id=\"campaign-performance-body\">\u003cdiv class=\"performance-filters\">${campaignFilterSelect()}\u003cdiv class=\"date-range-control\" role=\"group\" aria-label=\"Campaign date range\">\u003clabel class=\"range-field\">\u003cspan>From\u003c/span>\u003cinput id=\"campaign-from\" type=\"date\" value=\"${a.from}\" aria-label=\"Start date\" />\u003c/label>\u003cspan class=\"range-arrow\" aria-hidden=\"true\">${ico('arrow',13)}\u003c/span>\u003clabel class=\"range-field\">\u003cspan>To\u003c/span>\u003cinput id=\"campaign-to\" type=\"date\" value=\"${a.to}\" aria-label=\"End date\" />\u003c/label>\u003c/div>\u003c/div>\u003cdiv class=\"performance-content\">\u003cdiv class=\"performance-left\">\u003cdiv class=\"performance-options\">\u003cdiv class=\"analytics-segment\" role=\"group\" aria-label=\"Graph metric\">${[['compare','Compare'],['claims','Claims'],['redemptions','Redemptions']].map(([v,t])=>`\u003cbutton data-act=\"campaign-metric\" data-id=\"${v}\" class=\"${a.metric===v?'active':''}\">${t}\u003c/button>`).join('')}\u003c/div>\u003clabel class=\"preview-switch\">\u003cinput type=\"checkbox\" id=\"campaign-sample\" ${series.preview?'checked':''}/> Sample preview\u003c/label>\u003c/div>${campaignPerformanceChart(series)}\u003cdiv class=\"chart-legend\">${a.metric!=='redemptions'?'\u003cspan>\u003ci class=\"legend-dot legend-claims\">\u003c/i> Claims\u003c/span>':''}${a.metric!=='claims'?'\u003cspan>\u003ci class=\"legend-dot legend-redemptions\">\u003c/ c/p>\u003c/div>\u003cdiv class=\"svc-header-badge\">\u003ci>\u003c/i> Staff workspace\u003c/div>\u003c/header>`;}\nfunction svcMetric(title,val,icon){return `\u003cdiv class=\"svc-metric\">\u003cdiv class=\"svc-metric-head\">\u003cspan>${title}\u003c/span>${ico(icon,14)}\u003c/div>\u003cspan class=\"svc-metric-value\">${Number(val).toLocaleString('en-MY')}\u003c/span>\u003c/div>`;}\nfunction svcMatchCustomer(c){const q=state.customerSearch.toLowerCase().trim();if(!q)return true;return (c.name+' '+c.phone+' '+c.email).toLowerCase().includes(q);}\nfunction svcSimpleHeader(title){\n return `\u003cheader class=\"svc-simple-header\">\u003ch1>${title}\u003c/h1>\u003c/header>`;\n}\nfunction svcSimplePreview(){\n if(svcIsPreview())return `\u003cdiv class=\"svc-simple-preview\">${ico('info',13)} \u003cspan>\u003cstrong>Demo records\u003c/strong> \u00b7 Preview only, not saved or redeemable\u003c/span>\u003c/div>`;\n return state.serviceDataError?`\u003cdiv class=\"svc-simple-preview\">${ico('info',13)} ${esc(state.serviceDataError)}\u003c/div>`:'';\n}\nfunction svcCustomerRows(){\n const items=svcCustomers().filter(svcMatchCustomer);\n return `\u003cdiv class=\"svc-list\" id=\"svc-customer-list\">${items.map(c=>{\n  const pending=svcClaims().filter(x=>svcKey(x)===svcKey(c)&&x.status==='issued').length;\n  return `\u003cbutton type=\"button\" class=\"svc-row svc-simple-row ${svcKey(c)===state.serviceCustomerSelected?'is-selected':''}\" data-act=\"svc-customer-select\" data-id=\"${esc(svcKey(c))}\" aria-label=\"View ${esc(c.name)}\">\n   \u003cspan class=\"svc-avatar\">${esc(svcInitials(c.name))}\u003c/span>\n   \u003cspan class=\"svc-simple-row-main\">\u003cspan class=\"svc-row-name\">${esc(c.name)}\u003c/span>\u003cspan class=\"svc-row-meta\">${esc(c.phone||c.email||'No phone number')}\u003c/span>\u003c/span>\n   \u003cspan class=\"svc-simple-row-end\">${pending?`\u003cspan class=\"svc-pending-label\">${pending} ${pending===1?'offer':'offers'}\u003c/span>`:''}${ico('chevron',15)}\u003c/span>\n  \u003c/button>`;\n }).join('')||`\u003cdiv class=\"svc-empty\">${ico('search',24)}\u003cstrong>No guests found\u003c/strong>Try another name or phone number.\u003c/div>`}\u003c/div>`;\n}\nfunction svcCustomerDetail(c){\n if(!c)return `\u003cdiv class=\"svc-simple-no-selection\">${ico('user',24)}\u003cspan>Select a guest to see their details\u003c/span>\u003c/div>`;\n const linked=svcClaims().filter(x=>svcKey(x)===svcKey(c));\n const pending=linked.filter(x=>x.status==='issued');\n const redeemed=linked.filter(x=>x.status==='redeemed').length;\n return `\u003cdiv class=\"svc-simple-detail\">\n  \u003cdiv class=\"svc-simple-person\">\u003cspan class=\"svc-avatar svc-detail-avatar\">${esc(svcInitials(c.name))}\u003c/span>\u003cdiv>\u003cdiv class=\"svc-detail-name\">${esc(c.name)}\u003c/div>\u003cspan class=\"svc-detail-type\">Guest details\u003c/span>\u003c/div>\u003c/div>\n  \u003cdiv class=\"svc-simple-fields\">\u003cdiv class=\"svc-field\">\u003cspan>Phone\u003c/span>\u003cstrong>${esc(c.phone||'\u2014')}\u003c/strong>\u003c/div>\u003cdiv class=\"svc-field\">\u003cspan>Email\u003c/span>\u003cstrong>${esc(c.email||'\u2014')}\u003c/strong>\u003c/div>\u003cdiv class=\"svc-field\">\u003cspan>Redeemed offers\u003c/span>\u003cstrong>${redeemed}\u003c/strong>\u003c/div>\u003c/div>\n  \u003ch3 class=\"svc-simple-label\">Available offers\u003c/h3>\n  ${pending.length?pending.map(p=>`\u003cdiv class=\"svc-simple-offer\">\u003cdiv>\u003cstrong>${esc(p.campaignTitle||'Guest offer')}\u003c/strong>\u003csmall>${esc(p.reward||'Reward')}\u003c/small>\u003c/div>\u003cspan class=\"svc-status is-pending\">Pending\u003c/span>\u003c/div>`).join(''):`\u003cdiv class=\"svc-simple-muted\">No available offers\u003c/div>`}\n  \u003cdiv class=\"svc-simple-footnote\">Offers can only be redeemed by scanning a valid guest QR.\u003c/div>\n \u003c/div>`;\n}\nfunction serviceCustomers(){\n const customers=svcCustomers();\n if(!customers.some(c=>svcKey(c)===state.serviceCustomerSelected))state.serviceCustomerSelected=customers[0]?svcKey(customers[0]):'';\n const selected=customers.find(c=>svcKey(c)===state.serviceCustomerSelected)||null;\n const count=customers.filter(svcMatchCustomer).length;\n return `\u003cdiv class=\"svc-browse svc-browse-simple\">\u003cdiv class=\"svc-inner\">\n  ${svcSimpleHeader('Customers')}\n  \u003cdiv class=\"svc-workspace svc-workspace-simple\">\n   \u003csection class=\"svc-panel svc-simple-directory\" aria-label=\"Customer directory\">\n    \u003clabel class=\"svc-search svc-simple-search\">${ico('search',17)}\u003cinput id=\"svc-customer-search\" type=\"search\" placeholder=\"Search name or phone\" value=\"${esc(state.customerSearch)}\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Search customers\" />\u003c/label>\n    \u003cdiv class=\"svc-simple-count\" id=\"svc-customer-count\">${count} ${count===1?'guest':'guests'}\u003c/div>\n    ${svcCustomerRows()}\n   \u003c/section>\n   ${state.serviceSheetOpen?'\u003cbutton class=\"svc-sheet-backdrop\" type=\"button\" data-act=\"svc-detail-close\" aria-label=\"Close details\">\u003c/button>':''}\n   \u003csection class=\"svc-panel svc-simple-profile ${state.serviceSheetOpen?'is-open':''}\" aria-label=\"Selected customer\">\n    \u003cdiv class=\"svc-simple-panel-head\">\u003cstrong>Guest details\u003c/strong>\u003cbutton type=\"button\" class=\"svc-simple-close\" data-act=\"svc-detail-close\" aria-label=\"Close customer details\">${ico('close',20)}\u003c/button>\u003c/div>\n    \u003cdiv id=\"svc-customer-detail\">${svcCustomerDetail(selected)}\u003c/div>\n   \u003c/section>\n  \u003c/div>\n \u003c/div>\u003c/div>`;\n}\nfunction svcFilterHistory(c){\n const q=state.serviceHistorySearch.trim().toLowerCase();\n return !q||(String(c.name||'')+' '+String(c.phone||'')+' '+String(c.campaignTitle||'')+' '+String(c.id||'')+' '+String(c.redeemedBy||'')).toLowerCase().includes(q);\n}\nfunction svcSimpleStatus(c){\n return `\u003cspan class=\"svc-status ${c.status==='redeemed'?'is-done':c.status==='rejected'?'is-rejected':'is-pending'}\">${c.status==='redeemed'?'Redeemed':c.status==='rejected'?'Rejected':'Pending'}\u003c/span>`;\n}\nfunction svcHistoryRows(){\n const items=svcHistoryEvents().filter(svcFilterHistory).sort((a,b)=>String(b.redeemedAt||b.createdAt||'').localeCompare(String(a.redeemedAt||a.createdAt||'')));\n return `\u003cdiv class=\"svc-list\" id=\"svc-history-list\">${items.map(c=>`\u003cbutton type=\"button\" class=\"svc-row svc-simple-row svc-history-row ${c.id===state.serviceHistorySelected?'is-selected':''}\" data-act=\"svc-history-select\" data-id=\"${esc(c.id)}\" aria-label=\"View ${esc(c.name)} activity\">\n  \u003cspan class=\"svc-avatar\">${esc(svcInitials(c.name))}\u003c/span>\n  \u003cspan class=\"svc-simple-row-main\">\u003cspan class=\"svc-row-name\">${esc(c.name)}\u003c/span>\u003cspan class=\"svc-row-meta\">${esc(c.status==='rejected'?(c.reason||'QR not recognized'):(c.campaignTitle||'Offer'))}\u003c/span>\u003c/span>\n  \u003cspan class=\"svc-simple-row-end svc-simple-history-end\">${svcSimpleStatus(c)}\u003csmall>${esc(svcSimpleTime(c.redeemedAt||c.createdAt))}\u003c/small>\u003c/span>\n \u003c/button>`).join('')||`\u003cdiv class=\"svc-empty\">${ico('history',24)}\u003cstrong>No activity found\u003c/strong>Try another search.\u003c/div>`}\u003c/div>`;\n}\nfunction svcSimpleTime(raw){\n if(!raw)return '\u2014';const d=new Date(raw);if(!Number.isFinite(+d))return '\u2014';\n return d.toLocaleDateString('en-MY',{day:'numeric',month:'short',timeZone:'Asia/Kuala_Lumpur'})+' \u00b7 '+d.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kuala_Lumpur'});\n}\nfunction svcHistoryDetail(c){\n if(!c)return `\u003cdiv class=\"svc-simple-no-selection\">${ico('history',24)}\u003cspan>Select an entry to view details\u003c/span>\u003c/div>`;\n return `\u003cdiv class=\"svc-simple-detail\">\n  \u003cdiv class=\"svc-simple-person\">\u003cspan class=\"svc-avatar svc-detail-ava se-simple\">\u003cdiv class=\"svc-inner\">\n  ${svcSimpleHeader('History')}\n  \u003cdiv class=\"svc-workspace svc-workspace-simple\">\n   \u003csection class=\"svc-panel svc-simple-directory\" aria-label=\"Redemption history\">\n    \u003clabel class=\"svc-search svc-simple-search\">${ico('search',17)}\u003cinput id=\"svc-history-search\" type=\"search\" placeholder=\"Search guest or code\" value=\"${esc(state.serviceHistorySearch)}\" autocomplete=\"off\" spellcheck=\"false\" aria-label=\"Search redemption history\" />\u003c/label>\n    \u003cdiv class=\"svc-simple-count\" id=\"svc-history-count\">${count} ${count===1?'entry':'entries'}\u003c/div>\n    ${svcHistoryRows()}\n   \u003c/section>\n   ${state.serviceSheetOpen?'\u003cbutton class=\"svc-sheet-backdrop\" type=\"button\" data-act=\"svc-detail-close\" aria-label=\"Close details\">\u003c/button>':''}\n   \u003csection class=\"svc-panel svc-simple-profile ${state.serviceSheetOpen?'is-open':''}\" aria-label=\"Activity details\">\n    \u003cdiv class=\"svc-simple-panel-head\">\u003cstrong>Activity details\u003c/strong>\u003cbutton type=\"button\" class=\"svc-simple-close\" data-act=\"svc-detail-close\" aria-label=\"Close activity details\">${ico('close',20)}\u003c/button>\u003c/div>\n    \u003cdiv id=\"svc-history-detail\">${svcHistoryDetail(selected)}\u003c/div>\n   \u003c/section>\n  \u003c/div>\n \u003c/div>\u003c/div>`;\n}\nfunction staffScan(){\n const claim=state.lookup?.claim||null,ready=!!state.camera;\n const torchIcon=`\u003csvg viewBox=\"0 0 24 30\" width=\"28\" height=\"35\" aria-hidden=\"true\">\u003cpath fill=\"currentColor\" d=\"M3.6 2.3c0-1.1.9-2 2-2h12.8c1.1 0 2 .9 2 2v2.8H3.6V2.3Zm0 5h16.8v2.5c0 .6-.3 1.1-.7 1.5l-4.1 3.4v12.1a3.6 3.6 0 0 1-7.2 0V14.7l-4.1-3.4c-.5-.4-.7-.9-.7-1.5V7.3Z\"/>\u003ccircle cx=\"12\" cy=\"22\" r=\"2.1\" fill=\"#111\"/>\u003c/svg>`;\n const scanCorners=`\u003csvg class=\"ios-scan-corners\" viewBox=\"0 0 260 260\" aria-hidden=\"true\">\u003cpath d=\"M54 14H44C24 14 14 24 14 44V54 M206 14H216C236 14 246 24 246 44V54 M14 206V216C14 236 24 246 44 246H54 M246 206V216C246 236 236 246 216 246H206\" fill=\"none\" stroke=\"white\" stroke-width=\"6.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>`;\n return `\u003cdiv class=\"ios-scanner ${claim?'ios-has-result':''}\" id=\"ios-scanner\">\n   ${ready?'\u003cvideo id=\"scan-video\" class=\"ios-camera-feed\" autoplay muted playsinline aria-label=\"Live camera preview\">\u003c/video>':''}\n   \u003cdiv class=\"ios-camera-dim\" aria-hidden=\"true\">\u003c/div>\n   ${claim?`\u003csection class=\"ios-result-sheet\" aria-label=\"Guest claim verification\">${verificationResult()}\u003cbutton class=\"ios-scan-again\" data-act=\"scan-again\" type=\"button\">${ico('scan',16)} Scan next code\u003c/button>\u003c/section>`:\n   `${ready?`\u003cdiv class=\"ios-scan-target\" aria-hidden=\"true\">${scanCorners}\u003c/div>`:`\u003cbutton class=\"ios-scan-target\" data-act=\"cam-start\" aria-label=\"Tap to enable the camera\" type=\"button\">${scanCorners}\u003c/button>`}\u003cbutton class=\"ios-torch ${state.torchOn?'on':''}\" id=\"ios-torch\" type=\"button\" data-act=\"scan-torch\" aria-label=\"Toggle flashlight\" aria-pressed=\"${state.torchOn?'true':'false'}\" title=\"Flashlight\">${torchIcon}\u003c/button>`}\n \u003c/div>`;\n}\n\nfunction staffManual(){\n const claim=state.lookup?.claim||null;\n return `\u003csection class=\"svc-manual-page ${claim?'':'is-empty'}\" aria-label=\"Enter guest claim code\">\n  \u003cdiv class=\"svc-manual-inner\">\n   \u003ch1 class=\"svc-manual-title\">Enter code\u003c/h1>\n   \u003cp class=\"svc-manual-error\" id=\"manual-error\" role=\"status\">${esc(state.manualError)}\u003c/p>\n   ${claim?`\u003cdiv class=\"svc-manual-result\">${verificationResult()}\u003cbutton class=\"svc-manual-again\" data-act=\"manual-clear\" type=\"button\">${ico('search',16)} Enter another code\u003c/button>\u003c/div>`:\n   `\u003clabel class=\"svc-manual-upload\">${ico('qr',16)} Upload QR\u003cinput id=\"qr-file\" type=\"file\" accept=\"image/*\" class=\"sr\" aria-label=\"Upload QR\" />\u003c/label>`}\n  \u003c/div>\n \u003c/section>`;\n}\nfunction verificationResult(){const c=state.lookup.claim,camp=state.lookup.campaign;return `\u003cdiv class=\"scan-result\">\u003cdiv class=\"between\">\u003cdiv>\u003cdiv class=\"caps\">Matched guest\u003c/div>\u003cdiv class=\"claim-name\">${esc(c.name)}\u003c/div>\u003c/div>${claimTag(c)}\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Phone\u003c/span>\u003cspan>${esc(c.phone)}\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Campaign\u003c/span>\u003cspan>${esc(c.campaignTitle)}\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Discount\u003c/span>\u003cspan class=\"strong\">${esc(c.reward)}\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Claim code\u003c/span>\u003cspan class=\"monospace\">${esc(c.id)}\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Issued\u003c/span>\u003cspan>${dt(c.createdAt)}\u003c/span>\u003c/div>${c.redeemedAt?`\u003cdiv class=\"row-line\">\u003cspan>Redeemed\u003c/span>\u003cspan>${dt(c.redeemedAt)} by ${esc(c.redeemedBy)}\u003c/span>\u003c/div>`:''}${camp&&!active(camp)?`\u003cdiv class=\"hint-box hint-error\">This campaign is paused or expired. Redemption is unavailable.\u003c/div>`:''}${c.status==='issued'&&camp&&active(camp)?`\u003cform id=\"redeem-form\" style=\"margin-top:16px\">\u003cdiv class=\"field\">\u003clabel for=\"staff-name\">Staff name (optional)\u003c/label>\u003cinput class=\"input\" id=\"staff-name\" name=\"staffName\" placeholder=\"e.g. Counter 1\" maxlength=\"90\"/>\u003c/div>\u003cbutton class=\"btn btn-primary\" style=\"width:100%;margin-top:11px\" type=\"submit\">${ico('check')} Confirm redemption\u003c/button>\u003c/form>`:`\u003cdiv class=\"hint-box\">${c.status==='redeemed'?'Already used \u2014 this claim is locked from further redemption.':'This claim is not currently eligible for redemption.'}\u003c/div>`}\u003c/div>`;}\nfunction staffRedemptions(){const redeems=state.claims.filter(x=>x.status==='redeemed');return `\u003cdiv class=\"atlas-campaign-heading\">\u003ch1>${ico('history',18)}\u003cspan>Redemption\u003c/span>\u003c/h1>${button(ico('download')+' Export CSV','export-csv',false,'btn-sm')}\u003c/div>`+`\u003csection class=\"panel\">\u003cdiv class=\"panel-head\">\u003cdiv class=\"panel-title\">Redemptions \u003cspan class=\"muted\">(${redeems.length})\u003c/span>\u003csmall>Claimed codes are single-use.\u003c/small>\u003c/div>\u003cspan class=\"badge badge-success\">${redeems.length} verified\u003c/span>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable class=\"data-table\">\u003cthead>\u003ctr>\u003cth>Guest\u003c/th>\u003cth>Campaign\u003c/th>\u003cth>Discount\u003c/th>\u003cth>Claim code\u003c/th>\u003cth>Redeemed at\u003c/th>\u003cth>Staff\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${redeems.map(c=>`\u003ctr>\u003ctd>\u003cdiv class=\"table-name\">${esc(c.name)}\u003c/div>\u003cdiv class=\"table-note\">${esc(c.phone)}\u003c/div>\u003c/td>\u003ctd>${esc(c.campaignTitle)}\u003c/td>\u003ctd>${esc(c.reward)}\u003c/td>\u003ctd class=\"monospace\">${esc(c.id)}\u003c/td>\u003ctd>${dt(c.redeemedAt)}\u003c/td>\u003ctd>${esc(c.redeemedBy||'Store staff')}\u003c/td>\u003c/tr>`).join('')||`\u003ctr>\u003ctd colspan=\"6\">${panelEmpty('history','No redemptions yet','Verified redemptions appear once a staff member confirms a claim.')}\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>`;}\nfunction uniqueGuests(){const map=new Map();for(const c of [...state.claims].reverse()){const key=String(c.phone||'').replace(/\\s+/g,'');if(!key)continue;let g=map.get(key);if(!g){g={phone:key,name:c.name||'Guest',email:c.email||'',marketingConsent:!!c.marketingConsent,claims:0,redeemed:0,lastAt:c.createdAt||'',firstAt:c.createdAt||''};map.set(key,g);}g.claims++;if(c.status==='redeemed')g.redeemed++;if((c.createdAt||'')>g.lastAt){g.lastAt=c.createdAt;g.name=c.name||g.name;g.email=c.email||g.email;g.marketingConsent=!!c.marketingConsent;}if((c.createdAt||'')\u003cg.firstAt)g.firstAt=c.createdAt;}\n return Array.from(map.values()).sort((a,b)=>b.lastAt.localeCompare(a.lastAt));}\n// Database sheet schema follows GuestGraph Atlas Customer Sheet v3.5 (uploaded reference).\nconst normCustomerPhone=v=>String(v||'').replace(/[^0-9+]/g,'').replace(/^(?!\\+)0/, '0');\nfunction normalizeCustomer(c){let age=c.age===''||c.age==null?null:Number(c.age);return {name:String(c.name||'').trim().slice(0,120),phone:String(c.phone||'').trim().slice(0,35),email:String(c.email||'').trim().toLowerCase().slice(0,180),gender:['Male','Female','Other'].includes(c.gender)?c.gender:'Unspecified',age:Number.isFinite(age)&&age>0&&age\u003c=120?Math.round(age):null,lastPurchase:/^\\d{4}-\\d{2}-\\d{2}$/.test(c.lastPurchase||'')?c.lastPurchase:'',since:/^\\d{4}-\\d{2}-\\d{2}$/.test(c.since||'')?c.since:'',consent:['yes','no'].includes(c.consent)?c.consent:'unknown'};}\nfunction combinedCustomers(){const map=new Map(),key=c=>c.phone.replace(/\\D/g,'')||c.email.trim().toLowerCase();for(const c of state.customers){const v=normalizeCustomer(c);if(!v.name)continue;map.set(key(v),{...v,id:c.id||'',claims:0,redeemed:0,source:'saved',createdAt:c.createdAt||''});}\n for(const g of uniqueGuests()){const k=g.phone.replace(/\\D/g,''),existing=map.get(k);if(existing){existing.claims=g.claims;existing.redeemed=g.redeemed;existing.name=existing.name||g.name;existing.email=existing.email||g.email;if(existing.consent==='unknown'&&g.marketingConsent)existing.consent='yes';existing.since=existing.since||(g.firstAt||'').slice(0,10);existing.activityDate=(g.lastAt||'').slice(0,10);}else map.set(k,{...normalizeCustomer({name:g.name,phone:g.phone,email:g.email,since:(g.firstAt||'').slice(0,10),consent:g.marketingConsent?'yes':'no'}),id:'',claims:g.claims,redeemed:g.redeemed,source:'claim',activityDate:(g.lastAt||'').slice(0,10)});}\n return [...map.values()];}\nfunction dbCustomerStatus(c){if(!c.lastPurchase)return 'No purchase';const n=Math.floor((new Date(today()+'T12:00:00')-new Date(c.lastPurchase+'T12:00:00'))/86400000);return n>=0&&n\u003c=30?'Active':n>90?'Dormant':'Recent';}\nfunction dbRowsFiltered(){const u=state.dbView,query=u.search.trim().toLowerCase(),words=query.split(/\\s+/).filter(Boolean),now=new Date(today()+'T12:00:00');let rows=combinedCustomers().filter(c=>{const days=c.since?Math.floor((now-new Date(c.since+'T12:00:00'))/86400000):9999;const st=dbCustomerStatus(c);if(u.segment==='active'&&st!=='Active'||u.segment==='dormant'&&st!=='Dormant'||u.segment==='new'&&!(days>=0&&days\u003c=30)||u.segment==='consent'&&c.consent!=='yes'||u.segment==='no-purchase'&&st!=='No purchase')return false;if(u.gender!=='all'&&c.gender!==u.gender)return false;if(u.age!=='all'){const age=c.age;if(u.age==='unknown'&&age!==null)return false;if(u.age!=='unknown'&&(age===null||(u.age==='55+'?age\u003c55:(()=>{const [a,b]=u.age.split('-').map(Number);return age\u003ca||age>b;})())))return false;}const hay=(c.name+' '+c.phone+' '+c.email).toLowerCase().replace(/\\s+/g,' ');return words.every(w=>hay.includes(w));});\n if(u.sort==='name')rows.sort((a,b)=>a.name.localeCompare(b.name));else if(u.sort==='since')rows.sort((a,b)=>(b.since||'').localeCompare(a.since||''));else rows.sort((a,b)=>(b.lastPurchase||b.activityDate||b.since||'').localeCompare(a.lastPurchase||a.activityDate||a.since||''));return rows;}\nfunction dbKpis(){const rows=combinedCustomers();return {total:rows.length,active:rows.filter(c=>dbCustomerStatus(c)==='Active').length,dormant:rows.filter(c=>dbCustomerStatus(c)==='Dormant').length,consent:rows.filter(c=>c.consent==='yes').length};}\nconst dbDate=x=>x?x.slice(8,10)+'/'+x.slice(5,7)+'/'+x.slice(0,4):'\u2014';\nfunction dbCells(c,i){const st=dbCustomerStatus(c);return `\u003cbutton type=\"button\" class=\"atlas-db-row\" data-act=\"db-detail\" data-id=\"${i}\" title=\"View ${esc(c.name)}\" role=\"row\">\u003cspan class=\"db-name\" role=\"cell\">${esc(c.name)}\u003c/span>\u003cspan role=\"cell\">${esc(c.phone||'\u2014')}\u003c/span>\u003cspan role=\"cell\">${esc(c.email||'\u2014')}\u003c/span>\u003cspan role=\"cell\">${esc(c.gender)}\u003c/span>\u003cspan role=\"cell\">${c.age??'\u2014'}\u003c/span>\u003cspan role=\"cell\">${dbDate(c.lastPurchase)}\u003c/span>\u003cspan role=\"cell\">${dbDate(c.since)}\u003c/span>\u003cspan role=\"cell\">\u003ci class=\"db-status\">${esc(st)}\u003c/i>\u003c/span>\u003c/button>`;}\nfunction dbVirtualMarkup(rows,scrollTop=0){const rowH=37,viewH=Math.max(320,window.innerHeight-300),first=Math.max(0,Math.floor(scrollTop/rowH)-9),end=Math.min(rows.length,first+Math.ceil(viewH/rowH)+20);return `\u003cdiv style=\"height:${first*rowH}px\" aria-hidden=\"true\">\u003c/div>${rows.slice(first,end).map((c,j)=>dbCells(c,first+j)).join('')}\u003cdiv style=\"height:${Math.max(0,(rows.length-end)*rowH)}px\" aria-hidden=\"true\">\u003c/div>`;}\nfunction updateDBResults(reset=false){if(state.section!=='database')return;const viewport=document.getElementById('db-grid-scroll');if(!viewport)return;if(reset)viewport.scrollTop=0;const rows=dbRowsFiltered();state.dbVisibleRows=rows;document.getElementById('db-grid-rows').innerHTML=rows.length?dbVirtualMarkup(rows,viewport.scrollTop):'\u003cdiv class=\"atlas-db-empty\">No matching customers. Clear filters or try a different search.\u003c/div>';const n=document.getElementById('db-result-count');if(n)n.textContent=`Showing ${rows.length.toLocaleString('en-MY')} of ${combinedCustomers().length.toLocaleString('en-MY')} guests`;}\nfunction updateDBVirtual(){const viewport=document.getElementById('db-grid-scroll');if(viewport&&document.getElementById('db-grid-rows'))document.getElementById('db-grid-rows').innerHTML=dbVirtualMarkup(state.dbVisibleRows||dbRowsFiltered(),viewport.scrollTop);}\nfunction dbToolbar(){const u=state.dbView;return `\u003cdiv class=\"atlas-db-toolbar\">\u003clabel class=\"atlas-db-search\">${ico('sear \u201354'],['55+','55+'],['unknown','Unknown']].map(([v,l])=>`\u003coption value=\"${v}\" ${u.age===v?'selected':''}>${l}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>Order\u003cselect id=\"db-sort\">${[['recent','Most recent'],['name','Name A\u2013Z'],['since','Newest guests']].map(([v,l])=>`\u003coption value=\"${v}\" ${u.sort===v?'selected':''}>${l}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003cbutton type=\"button\" class=\"atlas-db-btn\" data-act=\"db-clear\">Clear filters\u003c/button>\u003c/div>`:''}\u003c/div>\u003cbutton type=\"button\" class=\"atlas-db-btn primary\" data-act=\"db-new\">${ico('plus',14)} New guest\u003c/button>\u003c/div>\u003cinput class=\"sr\" id=\"db-import-file\" type=\"file\" accept=\".csv,text/csv\" aria-label=\"Upload customer CSV\"/>\u003c/div>`;}\nfunction adminDatabase(){const k=dbKpis(),rows=dbRowsFiltered();state.dbVisibleRows=rows;return `\u003cdiv class=\"atlas-db-page\">\u003cdiv class=\"atlas-db-kpis\">${[['Total customers',k.total],['Active \u00b7 last 30 days',k.active],['Dormant \u00b7 90+ days',k.dormant],['Marketing opt-ins',k.consent]].map(([t,v])=>`\u003cdiv class=\"atlas-db-kpi\">\u003cstrong>${v.toLocaleString('en-MY')}\u003c/strong>\u003cspan>${t}\u003c/span>\u003c/div>`).join('')}\u003c/div>${dbToolbar()}\u003cdiv class=\"atlas-db-table-frame\">\u003cdiv class=\"atlas-db-table-x\">\u003cdiv class=\"atlas-db-inner\" role=\"table\" aria-label=\"Customer database\">\u003cdiv class=\"atlas-db-cols\" role=\"row\">${['Name','Number','Email','Gender','Age','Last purchase','Since','Status'].map(n=>`\u003cdiv role=\"columnheader\">${n}\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"atlas-db-grid-scroll\" id=\"db-grid-scroll\" role=\"rowgroup\">\u003cdiv id=\"db-grid-rows\">${rows.length?dbVirtualMarkup(rows):'\u003cdiv class=\"atlas-db-empty\">No customers yet. Guests appear after claiming a promotion, or choose New guest / Import CSV.\u003c/div>'}\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"atlas-db-foot\">\u003cspan id=\"db-result-count\">Showing ${rows.length.toLocaleString('en-MY')} of ${rows.length.toLocaleString('en-MY')} guests\u003c/span>\u003cspan>${isFile?'Local prototype':'Shared backend'} \u00b7 GuestGraph database\u003c/span>\u003c/div>\u003c/div>`;}\nfunction customerForm(c={}){return modalFrame(c.id||c.source==='claim'?'Customer details':'New guest','Atlas customer record \u2014 campaign activity is linked by phone.',`\u003cform id=\"customer-form\">\u003cinput type=\"hidden\" name=\"id\" value=\"${esc(c.id||'')}\">\u003cdiv class=\"form-grid\">\u003cdiv class=\"field\">\u003clabel>Name *\u003c/label>\u003cinput class=\"input\" name=\"name\" required maxlength=\"120\" value=\"${esc(c.name||'')}\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Number\u003c/label>\u003cinput class=\"input\" name=\"phone\" maxlength=\"35\" value=\"${esc(c.phone||'')}\">\u003c/div>\u003cdiv class=\"field full\">\u003clabel>Email\u003c/label>\u003cinput class=\"input\" type=\"email\" name=\"email\" value=\"${esc(c.email||'')}\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Gender\u003c/label>\u003cselect name=\"gender\" class=\"input\">${['Unspecified','Female','Male','Other'].map(v=>`\u003coption ${c.gender===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/div>\u003cdiv class=\"field\">\u003clabel>Age\u003c/label>\u003cinput class=\"input\" name=\"age\" type=\"number\" min=\"1\" max=\"120\" value=\"${c.age??''}\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Last purchase\u003c/label>\u003cinput class=\"input\" name=\"lastPurchase\" type=\"date\" value=\"${esc(c.lastPurchase||'')}\">\u003c/div>\u003cdiv class=\"field\">\u003clabel>Customer since\u003c/label>\u003cinput class=\"input\" name=\"since\" type=\"date\" value=\"${esc(c.since||today())}\">\u003c/div>\u003cdiv class=\"field full\">\u003clabel>Marketing consent\u003c/label>\u003cselect class=\"input\" name=\"consent\">${[['unknown','Not recorded'],['yes','Opted in'],['no','Opted out']].map(([v,l])=>`\u003coption value=\"${v}\" ${c.consent===v?'selected':''}>${l}\u003c/option>`).join('')}\u003c/select>\u003cdiv class=\"help\">Only mark opted in with the guest\u2019s explicit permission.\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"form-actions\">\u003cbutton type=\"button\" class=\"btn\" data-act=\"close-modal\">Cancel\u003c/button>\u003cbutton type=\"submit\" class=\"btn btn-primary\">${ico('check',14)} Save guest\u003c/button>\u003c/div>\u003c/form>`,true);}\nfunction csvSafe(s){const x=String(s??'');return '\"'+(/^[\\s]*[=+@\\-]/.test(x)?\"'\":'')+x.replace(/\"/g,'\"\"')+'\"';}\nfunction dbDownload(name,lines){const blob=new Blob(['\\uFEFF'+lines.map(row=>row.map(csvSafe).join(',')).join('\\r\\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}\nfunction dbExport(){dbDownload('GuestGraph_Customers_'+today()+'.csv',[['Name','Number','Email','Gender','Age','Last Purchase','Customer Since','Marketing Consent'],...dbRowsFiltered().map(c=>[c.name,c.phone,c.email,c.gender,c.age??'',c.lastPurchase,c.since,c.consent])]);notify('Customer CSV exported.','success');}\nfunction dbTemplate(){dbDownload('GuestGraph_CSV_Template.csv',[['Name','Number','Email','Gender','Age','Last Purchase','Customer Since','Marketing Consent'],['Alex Tan','0123456789','alex@example.com','Unspecified','','','2026-11-21','no']]);notify('Template downloaded.','success');}\nfunction csvParse(text){const records=[],rows=[],max=20000;let row=[],val='',quoted=false;for(let i=0;i\u003ctext.length;i++){const c=text[i];if(c==='\"'){if(quoted&&text[i+1]==='\"'){val+='\"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(val);val='';}else if((c==='\\r'||c==='\\n')&&!quoted){if(c==='\\r'&&text[i+1]==='\\n')i++;row.push(val);if(row.some(x=>x.trim()))rows.push(row);row=[];val='';if(rows.length>max+1)throw Error('Import a maximum of 20,000 CSV records at once.');}else val+=c;}if(quoted)throw Error('CSV contains an unclosed quote.');row.push(val);if(row.some(x=>x.trim()))rows.push(row);if(rows.length\u003c2)throw Error('CSV must include headers and at least one guest.');const heads=rows.shift().map(x=>x.toLowerCase().replace(/[^a-z]/g,''));const col=names=>heads.findIndex(h=>names.includes(h));const ix={name:col(['name','fullname','customername','guestname']),phone:col(['number','phone','phonenumber','mobile','contact']),email:col(['email','emailaddress']),gender:col(['gender','sex']),age:col(['age']),lastPurchase:col(['lastpurchase','lastpurchasedate']),since:col(['since','customersince','membersince','joindate']),consent:col(['consent','marketingconsent','optin','marketingoptin'])};if(ix.name\u003c0||(ix.phone\u003c0&&ix.email\u003c0))throw Error('CSV requires Name and Number or Email columns.');const toISO=x=>{if(/^\\d{4}-\\d{2}-\\d{2}$/.test(x))return x;const m=x.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:'';};for(const r of rows){const get=k=>ix[k]\u003c0?'':(r[ix[k]]||'').trim(),name=get('name');if(!name||!get('phone')&&!get('email'))continue;const c=normalizeCustomer({name,phone:get('phone'),email:get('email'),gender:get('gender'),age:get('age'),lastPurchase:toISO(get('lastPurchase')),since:toISO(get('since')),consent:['yes','y','true','1','opted in'].includes(get('consent').toLowerCase())?'yes':['no','n','false','0'].includes(get('consent').toLowerCase())?'no':'unknown'});records.push(c);}return records;}\nasync function importCustomers(file){if(!file)return;try{const rows=csvParse(await file.text());if(!rows.length)throw Error('No valid customer records in CSV.');let added=0,updated=0;for(let i=0;i\u003crows.length;i+=500){const r=await api('/api/admin/customers/import',{method:'POST',body:{rows:rows.slice(i,i+500)}});added+=r.added;updated+=r.updated;}await load();render();notify(`Imported ${added} new, updated ${updated} existing guests.`,'success');}catch(e){notify(e.message,'error');}}\n\nfunction staffSettings(){return `\u003cdiv class=\"atlas-campaign-heading\">\u003ch1>${ico('settings',18)}\u003cspan>Settings\u003c/span>\u003c/h1>\u003c/div>\u003cdiv class=\"settings-grid\">\u003csection class=\"panel panel-pad\">\u003cdiv class=\"panel-title\">Appearance\u003c/div>\u003cp class=\"muted tiny\">Atlas color theme. Changes apply immediately and are saved on this device.\u003c/p>\u003cdiv class=\"theme-choices\" role=\"group\" aria-label=\"Appearance\">\u003cbutton type=\"button\" class=\"atlas-db-btn ${state.theme==='dark'?'selected':''}\" data-act=\"theme-set\" data-id=\"dark\" aria-pressed=\"${state.theme==='dark'}\">${ico('moon',14)} Dark\u003c/button>\u003cbutton type=\"button\" class=\"atlas-db-btn ${state.theme==='light'?'selected':''}\" data-act=\"theme-set\" data-id=\"light\" aria-pressed=\"${state.theme==='light'}\">${ico('sun',14)} Light\u003c/button>\u003c/div>\u003c/section>\u003csection class=\"panel panel-pad\">\u003cdiv class=\"panel-title\">Administration\u003c/div>\u003cdiv class=\"campaign-detail spaced\">\u003cdiv class=\"row-line\">\u003cspan>Workspace\u003c/span>\u003cspan>Administration\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Data mode\u003c/span>\u003cspan>${isFile?'Browser-local demo':'Shared Node backend'}\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Guest Portal\u003c/span>\u003cspan>Offers and QR wallet\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Service Terminal\u003c/span>\u003cspan>QR verification and redemption\u003c/span>\u003c/div>\u003cdiv class=\"row-line\">\u003cspan>Customer database\u003c/span>\u003cspan>Customer records + linked guest claims\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"flex wrap spaced\">${button(ico('external')+' Guest Portal','view-guest')}${button(ico('scan')+' Service Terminal','view-terminal')}${button(ico('logout')+' Lock administration','staff-logout')}\u003c/div>\u003c/section>\u003csection class=\"panel panel-pad\">\u003cdiv class=\"panel-title\">Before launch\u003c/div>\u003cp class=\"muted tiny\">This prototype is not ready for real customer data. Set secure, role-based accounts, HTTPS, guest phone verification, a privacy notice and protected production storage before deployment.\u003c/p>\u003cdiv class=\"hint-box\">\u003cstrong>${isFile?'Offline demo':'Shared-data prototype'}\u003c/strong>\u003cdiv>${isFile?'Data is saved to this browser only. All three views share that local data in the same browser.':'Campaigns, claims and redemptions are saved in data.json on the server. The demo PINs are not production security.'}\u003c/div>\u003c/div>${isFile?button('Reset local demo data','reset-demo',false,'spaced'):''}\u003c/section>\u003c/div>`;}\n\nfunction staffLock(){return `\u003cdiv class=\"access-shell\">\u003csection class=\"pin-lock\">\u003cdiv class=\"access-symbol\">${ico('settings',21)}\u003c/div>\u003ch1>Administration\u003c/h1>\u003cp>Manage campaigns, redemptions and customers.\u003c/p>\u003cform id=\"unlock-form\">\u003clabel for=\"pin\">Access PIN\u003c/label>\u003cinput class=\"input\" id=\"pin\" name=\"pin\" type=\"password\" inputmode=\"numeric\" minlength=\"4\" required placeholder=\"Enter your PIN\" autocomplete=\"off\"/>\u003cbutton type=\"submit\" class=\"btn btn-primary\">Continue ${ico('arrow')}\u003c/button>\u003c/form>\u003cdiv class=\"access-foot\">Demo PIN: \u003cstrong>8642\u003c/strong>\u003c/div>\u003cbutton class=\"link access-back\" data-act=\"view-guest\">Guest Portal\u003c/button>\u003c/section>\u003c/div>`;}\n\nfunction guestHeader(){return `\u003cheader class=\"guest-header\">\u003cdiv class=\"brand\">${logo()}\u003c/div>\u003cnav class=\"header-nav\">\u003cbutton class=\"navlink ${state.guestSection==='discover'?'active':''}\" data-act=\"guest-nav\" data-id=\"discover\">Discover\u003c/button>\u003cbutton class=\"navlink ${state.guestSection==='wallet'?'active':''}\" data-act=\"guest-nav\" data-id=\"wallet\">My wallet ${state.mine.length?'\u00b7 '+state.mine.length:''}\u003c/button>\u003c/nav>\u003cdiv class=\"flex\">${state.profile?`\u003cspan class=\"guest-profile\">Hi, ${esc(state.profile.name.split(' ')[0])}\u003c/span>\u003cbutton class=\"btn btn-quiet btn-sm\" data-act=\"guest-profile\">${ico('user')} \u003cspan>Switch\u003c/span>\u003c/button>`:button(ico('user')+' Sign in','guest-profile',false,'btn-sm')}\u003c/div>\u003c/header>`;}\nfunction guestCards(){return state.campaigns.length?`\u003cdiv class=\"offer-grid\">${state.campaigns.map(c=>{const mine=state.mine.find(x=>x.campaignId===c.id);return `\u003carticle class=\"offer-card\" ${state.focusCampaign===c.id?'style=\"border-color:#b7b7b7\"':''}>\u003cdiv class=\"offer-top\">\u003cdiv class=\"between\">\u003cspan class=\"kicker\">${ico(c.type==='first'?'gift':'ticket')} ${esc(labelType(c))}\u003c/span>\u003cspan class=\"badge badge-dot badge-success\">Live\u003c/span>\u003c/div>\u003cdiv class=\"offer-reward\">${esc(reward(c))}\u003c/div>\u003cdiv class=\"offer-title\">${esc(c.title)}\u003c/div>\u003cp class=\"offer-desc\">${esc(c.description)}\u003c/p>\u003c/div>\u003cdiv class=\"offer-bottom\">\u003cspan class=\"muted\">Ends ${day(c.expiresAt)}\u003c/span>${mine?button(mine.status==='redeemed'?'View used claim':ico('qr')+' Show my QR','show-claim',true,'btn-sm\" data-id=\"'+esc(mine.id)):button('Claim now '+ico('arrow'),'claim-offer',true,'btn-sm\" data-id=\"'+esc(c.id))}\u003c/div>\u003c/article>`;}).join('')}\u003c/div>`:panelEmpty('ticket','No active offers','Check back when a new promotion is available.');}\nfunction guestWallet(){if(!state.profile)return `\u003csection class=\"panel\">${panelEmpty('user','Set up your guest profile','Use your name and phone number to see saved offers.',button(ico('user')+' Get started','guest-profile',true))}\u003c/section>`;return state.mine.length?`\u003cdiv class=\"guest-wallet\">${state.mine.map(c=>`\u003cdiv class=\"wallet-card\">\u003cdiv class=\"wallet-main\">\u003cdiv class=\"between\" style=\"justify-content:flex-start\">\u003cspan class=\"wallet-title\">${esc(c.campaignTitle)}\u003c/span>${claimTag(c)}\u003c/div>\u003cdiv class=\"wallet-code monospace\">${esc(c.id)} \u00b7 ${esc(c.reward)}\u003c/div>\u003c/div>${button(c.status==='redeemed'?'View receipt':ico('qr')+' Show QR','show-claim',c.status!=='redeemed','btn-sm\" data-id=\"'+esc(c.id))}\u003c/div>`).join('')}\u003c/div>`:`\u003csection class=\"panel\">${panelEmpty('ticket','Your wallet is empty','Claim an offer and it will appear here until staff scans it.',button('Explore offers','back-offers',true))}\u003c/section>`;}\nfunction guestContent(){const claimed=state.mine.filter(x=>x.status==='issued').length,redeemed=state.mine.filter(x=>x.status==='redeemed').length;return `${guestHeader()}\u003cmain class=\"guest-body\">\u003csection class=\"guest-hero\">\u003cdiv class=\"hero-copy\">\u003cdiv class=\"kicker\">\u003cspan class=\"eyedot\">\u003c/span> GuestGraph \u00b7 Member offers\u003c/div>\u003ch1>Good things.\u003cbr/>Just one scan away.\u003c/h1>\u003cp>Discover exclusive offers, claim your reward and show your QR code at the counter. That simple.\u003c/p>\u003cdiv class=\"hero-bottom\">${button('Explore offers '+ico('arrow'),'back-offers',true,'btn-lg')}${button(ico('qr')+' My QR wallet','goto-wallet',false,'btn-lg')}\u003c/div>\u003c/div>\u003cdiv class=\"hero-mark\" aria-hidden=\"true\">G\u00b7G\u003c/div>\u003c/section>\u003cdiv class=\"guest-metrics\">\u003cdiv class=\"guest-metric\">\u003cstrong>${state.campaigns.length}\u003c/strong>\u003cspan>Available offers\u003c/span>\u003c/div>\u003cdiv class=\"guest-metric\">\u003cstrong>${claimed}\u003c/strong>\u003cspan>Ready to use\u003c/span>\u003c/div>\u003cdiv class=\"guest-metric\">\u003cstrong>${redeemed}\u003c/strong>\u003cspan>Rewards enjoyed\u003c/span>\u003c/div>\u003c/div>${state.guestSection==='discover'?`\u003csection class=\"gues
